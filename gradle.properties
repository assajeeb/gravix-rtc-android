# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx4g
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
org.gradle.parallel=true
# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
# Automatically convert third-party libraries to use AndroidX
android.enableJetifier=false
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configureondemand=true
org.gradle.daemon=true

kotlin.incremental=true
kapt.incremental.apt=true
kapt.use.worker.api=true


###############################################################

GROUP=com.gravixcloud
# GRAVIX: the Gravix SDK version (Maven artifact, Version.CLIENT_VERSION).
VERSION_NAME=0.3.0
# GRAVIX: the upstream engine this fork is based on. Sent to the server as ClientInfo.version / the
# `version` connect parameter, like the Flutter SDK does (it reports its upstream base version): any
# server rule keyed on the Android SDK version then sees the engine that is actually running.
# Update it with every upstream sync.
UPSTREAM_ENGINE_VERSION=2.28.2

# GRAVIX(pom): maintained by hand since Phase 4 (tools/rebrand/rebrand.sh step 7 sets these keys only on a tree
# without this marker, i.e. pristine upstream). The published POM: gravix-rtc-android-sdk/build.gradle, mavenPublishing.
# POM_NAME / POM_ARTIFACT_ID are in gravix-rtc-android-sdk/gradle.properties.
POM_DESCRIPTION=Gravix Cloud Android SDK: real-time audio and video rooms on Gravix Cloud, with start-up region measurement, region failover and session recovery. Kotlin and Java.
POM_INCEPTION_YEAR=2026
POM_URL=https://gravixcloud.com
POM_LICENCE_NAME=The Apache Software License, Version 2.0
POM_LICENCE_URL=https://www.apache.org/licenses/LICENSE-2.0.txt
POM_LICENCE_DIST=repo
POM_DEVELOPER_ID=gravitycompile
POM_DEVELOPER_NAME=Gravity Compile
POM_DEVELOPER_URL=https://gravixcloud.com
# The PUBLIC source repository (the clean snapshot made by tools/release/public-snapshot.sh), never the private
# development repository. A Central upload refuses to run while any of these contains ".invalid".
POM_SCM_URL=https://github.com/assajeeb/gravix-rtc-android
POM_SCM_CONNECTION=scm:git:https://github.com/assajeeb/gravix-rtc-android.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/assajeeb/gravix-rtc-android.git

# GRAVIX: no publishing credentials or signing keys in this file, ever. The Portal user token
# (mavenCentralUsername / mavenCentralPassword) and the signing setup (signing.gnupg.keyName for the gpg
# command, or signingInMemoryKey*) live in ~/.gradle/gradle.properties or ORG_GRADLE_PROJECT_* variables.
# See RELEASING.md.

# For instrumented tests.
# WARNING: Do not edit this and potentially commit to repo.
# Instead, override in ~/.gradle/gradle.properties
gravixUrl=
gravixApiKey=
gravixApiSecret=
