plugins {
    id "org.jetbrains.dokka"
    id 'com.android.library'
    id 'kotlin-android'
    id 'kotlin-kapt'
    id 'com.google.protobuf'
}

android {
    namespace 'com.gravixcloud.rtc.test'
    compileSdkVersion androidSdk.compileVersion

    defaultConfig {
        minSdkVersion androidSdk.minVersion
        targetSdkVersion androidSdk.targetVersion

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility java_version
        targetCompatibility java_version
    }
    kotlinOptions {
        freeCompilerArgs = ["-Xinline-classes", "-opt-in=kotlin.RequiresOptIn", "-opt-in=com.gravixcloud.rtc.annotations.Beta"]
        jvmTarget = java_version
    }
    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
    lint {
        disable 'VisibleForTests'
    }
}

ext.gravixProtoIncludes = [
        'livekit_token_source.proto',
        'livekit_room.proto',
        'livekit_agent_dispatch.proto',
        'livekit_agent.proto',
        'livekit_egress.proto',
]
ext.gravixProtoImportSrc = true
apply from: rootProject.file('gradle/gravix-protobuf.gradle')

// Allow this module's Kotlin compilations to resolve `internal` APIs from :gravix-rtc-android-sdk
// https://kotlinlang.org/docs/visibility-modifiers.html#modules
//
// Use projectsEvaluated so :gravix-rtc-android-sdk Kotlin compile tasks exist before friendPaths
// references them.
gradle.projectsEvaluated {
    def sdk = rootProject.project(':gravix-rtc-android-sdk')
    project.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach { task ->
        def variant
        if (task.name.startsWith('compileDebug')) {
            variant = 'Debug'
        } else if (task.name.startsWith('compileRelease')) {
            variant = 'Release'
        } else {
            return
        }
        // Point at the same `classes.jar` AGP puts on the compile classpath (not only `tmp/kotlin-classes`),
        // or Kotlin will not treat the SDK as a friend module for `internal` visibility.
        task.friendPaths.from(sdk.tasks.named("bundleLibCompileToJar${variant}"))
    }
}

dokkaHtml {
    moduleName.set("gravix-rtc-android-test")
    dokkaSourceSets {
        configureEach {
            skipEmptyPackages.set(true)
            includeNonPublic.set(false)
            includes.from("module.md")
            displayName.set("Gravix Mocks")
            sourceLink {
                localDirectory.set(file("src/main/java"))

                // URL showing where the source code can be accessed through the web browser
                remoteUrl.set(new URL(
                    "${POM_SCM_URL}/tree/main/gravix-rtc-android-test/src/main/java" /* GRAVIX */))
                // Suffix which is used to append the line number to the URL. Use #L for GitHub
                remoteLineSuffix.set("#L")
            }

            perPackageOption {
                matchingRegex.set(".*\\.dagger.*")
                suppress.set(true)
            }

            perPackageOption {
                matchingRegex.set(".*\\.util.*")
                suppress.set(true)
            }
        }
    }
}

dependencies {

    implementation(project(":gravix-rtc-android-sdk"))
    implementation libs.coroutines.lib
    implementation libs.kotlinx.serialization.json
    api libs.okhttp.lib
    implementation libs.androidx.annotation
    api libs.protobuf.javalite
    implementation libs.android.jain.sip.ri
    implementation libs.junit
    implementation libs.robolectric
    implementation libs.mockito.core
    implementation libs.mockito.kotlin
    implementation libs.mockito.inline
    implementation libs.androidx.test.core
    implementation libs.coroutines.test
    implementation libs.dagger.lib
    implementation libs.byte.buddy
    kapt libs.dagger.compiler

    testImplementation libs.junit
    testImplementation libs.robolectric
    testImplementation libs.okhttp.mockwebserver
    testImplementation "org.jetbrains.kotlin:kotlin-reflect:$kotlin_version"
    kaptTest libs.dagger.compiler

    androidTestImplementation libs.androidx.test.junit
    androidTestImplementation libs.espresso
}
tasks.withType(Test).configureEach {
    systemProperty "robolectric.logging.enabled", true
}

